<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sistem Presensi Online</title>
    <link rel="manifest" href="./manifest.json">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body, html { 
            margin: 0; 
            padding: 0; 
            height: 100%; 
            overflow: hidden; 
            font-family: 'Inter', sans-serif; 
            background-color: #f8fafc; 
        }

        /* Container Iframe (Penuh 100%) */
        #iframe-container {
            width: 100%;
            height: 100%;
            position: relative;
            z-index: 1;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* ========================================= */
        /* FLOATING BANNER DI ATAS (SLIDE DOWN)      */
        /* ========================================= */
        #apk-banner {
            position: fixed;
            top: 20px; /* Posisi di atas layar */
            left: 50%;
            transform: translate(-50%, -150px); /* Posisi awal tersembunyi di atas */
            opacity: 0;
            width: 90%;
            max-width: 400px;
            background: rgba(15, 23, 42, 0.95); /* Warna Slate-900 elegan */
            backdrop-filter: blur(8px);
            color: #ffffff;
            padding: 12px 16px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            transition: all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275); /* Efek memantul halus */
            z-index: 9999;
            pointer-events: none; /* Nonaktifkan klik saat tersembunyi */
        }

        #apk-banner.show {
            transform: translate(-50%, 0);
            opacity: 1;
            pointer-events: auto;
        }

        .banner-text {
            flex: 1;
        }

        .banner-title {
            font-size: 13px;
            font-weight: 700;
            color: #5eead4; /* Warna Teal Terang */
            margin-bottom: 2px;
        }

        .banner-desc {
            font-size: 11px;
            color: #cbd5e1;
            line-height: 1.4;
        }

        .banner-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-download {
            background: #0d9488; /* Warna Teal 600 */
            color: #ffffff;
            text-decoration: none;
            padding: 8px 12px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: background 0.3s;
        }

        .btn-download:active {
            background: #0f766e;
        }

        .btn-close {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: #cbd5e1;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.3s, color 0.3s;
        }

        .btn-close:active {
            background: rgba(255, 255, 255, 0.2);
            color: #ffffff;
        }
    </style>
</head>
<body>

    <!-- IFRAME APLIKASI GAS DENGAN IZIN KAMERA & LOKASI -->
    <div id="iframe-container">
        <iframe src="https://script.google.com/macros/s/AKfycbw_lUQnEfFm8mplN-MvXcSwxuKJYSj28rRXZS0enMGw6XX6qPVAZxc3ZCYoYtxRphgx/exec" 
                allow="camera; geolocation; microphone; fullscreen" 
                allowfullscreen>
        </iframe>
    </div>

    <!-- FLOATING BANNER APK DI ATAS -->
    <div id="apk-banner">
        <div class="banner-text">
            <div class="banner-title">Instal Aplikasi</div>
            <div class="banner-desc">Lebih cepat & hemat kuota</div>
        </div>
        <div class="banner-actions">
            <a href="./app.apk" id="btn-download-apk" download class="btn-download">Unduh</a>
            <button id="btn-close-apk" class="btn-close" aria-label="Tutup">&times;</button>
        </div>
    </div>

    <script>
        // 1. Registrasi Service Worker untuk PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch(err => console.error("Service Worker Error:", err));
            });
        }

        // 2. Logika Deteksi, Animasi Popup, dan Timer 10 Detik
        document.addEventListener('DOMContentLoaded', () => {
            const banner = document.getElementById('apk-banner');
            const btnClose = document.getElementById('btn-close-apk');
            const btnDownload = document.getElementById('btn-download-apk');

            const userAgent = navigator.userAgent || navigator.vendor || window.opera;
            const isAndroid = /android/i.test(userAgent);
            const isAPK = userAgent.includes("PuskesmasApp-APK");
            const isStandalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone;
            const isDismissed = localStorage.getItem('apkBannerDismissed');

            let autoCloseTimer = null;

            const hideBanner = () => {
                banner.classList.remove('show');
                if (autoCloseTimer) clearTimeout(autoCloseTimer);
                localStorage.setItem('apkBannerDismissed', 'true');
            };

            if (isAndroid && !isAPK && !isStandalone && !isDismissed) {
                // Munculkan popup setelah 2 detik halaman dimuat
                setTimeout(() => {
                    banner.classList.add('show');

                    // OTOMATIS HILANG SETELAH 10 DETIK
                    autoCloseTimer = setTimeout(() => {
                        hideBanner();
                    }, 10000); // 10.000 milidetik = 10 detik

                }, 2000); 
            }

            btnClose.addEventListener('click', hideBanner);
            
            btnDownload.addEventListener('click', () => {
                setTimeout(hideBanner, 500); 
            });
        });
    </script>

</body>
</html>
