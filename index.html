<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistem Presensi Online</title>
  <link rel="manifest" href="./manifest.json">
  <style>
    body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; font-family: sans-serif; }
    
    /* Header Bar Hitam Simpel */
    #apk-top-bar {
      display: none;
      background: #111111;
      color: #ffffff;
      padding: 8px 15px;
      font-size: 13px;
      box-sizing: border-box;
    }
    
    .bar-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 1000px;
      margin: 0 auto;
    }

    .btn-download {
      background: #ffffff;
      color: #000000;
      text-decoration: none;
      padding: 5px 12px;
      border-radius: 4px;
      font-weight: bold;
      font-size: 12px;
    }

    .btn-close {
      background: none;
      border: none;
      color: #888888;
      font-size: 16px;
      margin-left: 10px;
      cursor: pointer;
    }

    /* Container untuk Iframe */
    #iframe-container {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>

  <!-- HEADER BAR HITAM -->
  <div id="apk-top-bar">
    <div class="bar-container">
      <span>Gunakan aplikasi untuk pengalaman lebih cepat</span>
      <div>
        <!-- Sesuaikan nama file APK Anda -->
        <a href="./app.apk" download class="btn-download">Unduh Aplikasi</a>
        <button id="btn-close-apk" class="btn-close">&times;</button>
      </div>
    </div>
  </div>

  <!-- IFRAME APLIKASI GAS -->
  <div id="iframe-container">
    <iframe src="https://script.google.com/macros/s/AKfycbw_lUQnEfFm8mplN-MvXcSwxuKJYSj28rRXZS0enMGw6XX6qPVAZxc3ZCYoYtxRphgx/exec" style="width:100%; height:100%; border:none;" allow="geolocation"></iframe>
  </div>

  <script>
    // Registrasi Service Worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(err => console.error(err));
      });
    }

    // Tampilkan Header hanya jika di HP Android
    window.addEventListener('load', () => {
      const topBar = document.getElementById('apk-top-bar');
      const iframeContainer = document.getElementById('iframe-container');
      const btnClose = document.getElementById('btn-close-apk');
      const isAndroid = /Android/i.test(navigator.userAgent);

      if (isAndroid && !sessionStorage.getItem('apkBarDismissed')) {
        topBar.style.display = 'block';
        // Sesuaikan tinggi iframe agar tidak terpotong header
        iframeContainer.style.height = 'calc(100% - ' + topBar.offsetHeight + 'px)';
      }

      btnClose.addEventListener('click', () => {
        topBar.style.display = 'none';
        iframeContainer.style.height = '100%';
        sessionStorage.setItem('apkBarDismissed', 'true');
      });
    });
  </script>

</body>
</html>
