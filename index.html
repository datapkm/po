<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sistem Presensi Online</title>
    <link rel="manifest" href="./manifest.json">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body, html { 
            margin: 0; 
            padding: 0; 
            height: 100%; 
            overflow: hidden; 
            font-family: 'Inter', sans-serif; 
            background-color: #f8fafc; 
        }

        /* Container Iframe (Penuh 100%) */
        #iframe-container {
            width: 100%;
            height: 100%;
            position: relative;
            z-index: 1;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* ========================================= */
        /* FLOATING BANNER LEBAR & MINIMALIS         */
        /* ========================================= */
        #apk-banner {
            position: fixed;
            top: 15px;
            left: 50%;
            transform: translate(-50%, -150px);
            opacity: 0;
            width: auto;         /* Lebar otomatis menyesuaikan isi */
            min-width: 280px;    /* Tidak terlalu kecil */
            max-width: 90%;      /* Aman tidak menabrak tepi layar */
            background: rgba(15, 23, 42, 0.96);
            backdrop-filter: blur(10px);
            color: #ffffff;
            padding: 8px 14px;   /* Padding lebih pas */
            border-radius: 30px; /* Membuat sudutnya lonjong/pill rapi */
            box-shadow: 0 8px 20px rgba(0,0,0,0.25);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 9999;
            pointer-events: none;
        }

        #apk-banner.show {
            transform: translate(-50%, 0);
            opacity: 1;
            pointer-events: auto;
        }

        .banner-text {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .banner-title {
            font-size: 12px;
            font-weight: 700;
            color: #5eead4;
            white-space: nowrap;
        }

        .banner-desc {
            font-size: 11px;
            color: #cbd5e1;
            border-left: 1px solid rgba(255,255,255,0.2);
            padding-left: 8px;
            white-space: nowrap;
        }

        .banner-actions {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-download {
            background: #0d9488;
            color: #ffffff;
            text-decoration: none;
            padding: 5px 10px;
            border-radius: 20px; /* Tombol lonjong rapi */
            font-weight: 700;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: background 0.3s;
            white-space: nowrap;
        }

        .btn-close {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: #94a3b8;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: color 0.3s, background 0.3s;
        }

        .btn-close:active, .btn-close:hover {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body>

    <!-- IFRAME APLIKASI GAS -->
    <div id="iframe-container">
        <iframe src="https://script.google.com/macros/s/AKfycbw_lUQnEfFm8mplN-MvXcSwxuKJYSj28rRXZS0enMGw6XX6qPVAZxc3ZCYoYtxRphgx/exec" 
                allow="camera; geolocation; microphone; fullscreen" 
                allowfullscreen>
        </iframe>
    </div>

    <!-- FLOATING BANNER APK -->
    <div id="apk-banner">
        <div class="banner-text">
            <span class="banner-title">Instal APK</span>
            <span class="banner-desc">Lebih cepat & stabil</span>
        </div>
        <div class="banner-actions">
            <a href="./app.apk" id="btn-download-apk" download class="btn-download">Unduh</a>
            <button id="btn-close-apk" class="btn-close" aria-label="Tutup">&times;</button>
        </div>
    </div>

    <script>
        // Registrasi Service Worker untuk PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch(err => console.error("Service Worker Error:", err));
            });
        }

        // Logika Banner: Muncul Setiap Reload, Lebar, Minimalis, & Hilang 10 Detik
        document.addEventListener('DOMContentLoaded', () => {
            const banner = document.getElementById('apk-banner');
            const btnClose = document.getElementById('btn-close-apk');
            const btnDownload = document.getElementById('btn-download-apk');

            const userAgent = navigator.userAgent || navigator.vendor || window.opera;
            const isAndroid = /android/i.test(userAgent);
            const isAPK = userAgent.includes("PuskesmasApp-APK");
            const isStandalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone;

            let autoCloseTimer = null;

            const hideBanner = () => {
                banner.classList.remove('show');
                if (autoCloseTimer) clearTimeout(autoCloseTimer);
            };

            // Syarat muncul: Hanya Android murni (bukan dalam APK dan bukan PWA)
            // Tanpa pengecekan localStorage, jadi AKAN MUNCUL SETIAP RELOAD
            if (isAndroid && !isAPK && !isStandalone) {
                setTimeout(() => {
                    banner.classList.add('show');

                    // Otomatis hilang setelah 10 detik
                    autoCloseTimer = setTimeout(() => {
                        hideBanner();
                    }, 10000);

                }, 1500); 
            }

            btnClose.addEventListener('click', hideBanner);
            
            btnDownload.addEventListener('click', () => {
                setTimeout(hideBanner, 500); 
            });
        });
    </script>

</body>
</html>
